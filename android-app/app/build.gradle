plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soulbot.app'
    compileSdk 35

    defaultConfig {
        // Optional parallel-install build when the original APK's signing key
        // is unavailable. The standard build keeps the original package ID.
        applicationId project.findProperty('soulbotApplicationId') ?: "com.soulbot.app"
        manifestPlaceholders = [soulbotAppLabel: project.findProperty('soulbotApplicationId')
            ? "SoulBot 未读修复版" : "@string/app_name"]
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.1.4"
        testInstrumentationRunner "com.soulbot.app.MemoryDatabaseInstrumentation"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
